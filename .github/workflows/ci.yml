name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline-tests:
    name: Pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run pipeline tests
        run: python -m pytest

  airflow-dag:
    name: Airflow DAG validation
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ runner.temp }}/airflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Airflow with its official constraints
        run: |
          python -m pip install "apache-airflow==3.3.2" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.10.txt"
      - name: Install project and tests
        run: python -m pip install -e ".[dev]"
      - name: Validate Airflow DAG import and dependencies
        run: python -m pytest airflow/tests
